<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Sistema</title>
  
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    h1, h2 {
      margin-top: 30px;
    }

    input {
      display: block;
      margin: 5px 0;
      padding: 8px;
      width: 300px;
    }

    button {
      padding: 10px;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    .card {
      background: white;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body style="display:none;">

<h1>Panel Admin</h1>

<!-- ========================= -->
<!-- CREAR RESTAURANTE -->
<!-- ========================= -->

<h2>Crear Restaurante</h2>

<input id="nombre" placeholder="Nombre">
<input id="logo" placeholder="URL Logo">
<input id="woo" placeholder="Woo URL">
<input id="ck" placeholder="Consumer Key">
<input id="cs" placeholder="Consumer Secret">
<input id="shipday" placeholder="Shipday API">

<button onclick="crearRestaurante()">Crear Restaurante</button>

<hr>

<h2>Restaurantes</h2>
<div id="lista"></div>

<!-- ========================= -->
<!-- CREAR USUARIO -->
<!-- ========================= -->

<h2>Crear Usuario</h2>

<input id="emailUser" placeholder="Email">
<input id="passUser" placeholder="Password">
<input id="restUser" placeholder="ID Restaurante">

<button onclick="crearUsuario()">Crear Usuario</button>

<hr>

<h2>Usuarios</h2>
<div id="listaUsuarios"></div>

<!-- ========================= -->
<!-- SCRIPT -->
<!-- ========================= -->

<script>

/////////////////////////////
// RESTAURANTES
/////////////////////////////

let restaurantesActuales = [];

async function crearRestaurante() {

  const data = {
    nombre: document.getElementById('nombre').value,
    logo_url: document.getElementById('logo').value,
    woo_url: document.getElementById('woo').value,
    consumer_key: document.getElementById('ck').value,
    consumer_secret: document.getElementById('cs').value,
    shipday_api: document.getElementById('shipday').value
  };

  await fetch('/admin/restaurantes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  alert('Restaurante creado');

  limpiarCamposRestaurante();
  cargarRestaurantes();
}


function limpiarCamposRestaurante() {
  document.getElementById('nombre').value = '';
  document.getElementById('logo').value = '';
  document.getElementById('woo').value = '';
  document.getElementById('ck').value = '';
  document.getElementById('cs').value = '';
  document.getElementById('shipday').value = '';
}


async function cargarRestaurantes() {

  const res = await fetch('/admin/restaurantes');
  const data = await res.json();
  restaurantesActuales = data;

  const cont = document.getElementById('lista');
  cont.innerHTML = '';

  data.forEach(r => {
    cont.innerHTML += `
      <div class="card">
        <b>${r.nombre}</b><br>
        ID: ${r.id}<br>
        Woo: ${r.woo_url || 'Sin configurar'}<br>
        Estado: ${r.activo ? 'Activo' : 'Inactivo'}<br>
        Consumer Key: ${r.consumer_key || 'Sin configurar'}<br>
        Consumer Secret: ${r.consumer_secret || 'Sin configurar'}<br>
        Shipday API: ${r.shipday_api || 'Sin configurar'}<br>
        Webhook token: ${r.webhook_token || 'Sin configurar'}<br>
        Woo webhook secret: ${r.woo_webhook_secret || 'Sin configurar'}<br>
        Shipday webhook secret: ${r.shipday_webhook_secret || 'Sin configurar'}<br>
        <button onclick="editarRestaurante(${r.id})">Editar</button>
        <button onclick="generarSecretos(${r.id})">Generar secretos</button>
      </div>
    `;
  });
}

async function editarRestaurante(id) {
  const actual = restaurantesActuales.find(r => Number(r.id) === Number(id));
  if (!actual) return;

  const data = {
    nombre: prompt('Nombre', actual.nombre || ''),
    logo_url: prompt('URL del logo', actual.logo_url || ''),
    woo_url: prompt('Woo URL', actual.woo_url || ''),
    consumer_key: prompt('Consumer Key (vacío o enmascarado conserva el actual)', actual.consumer_key || ''),
    consumer_secret: prompt('Consumer Secret (vacío o enmascarado conserva el actual)', actual.consumer_secret || ''),
    shipday_api: prompt('Shipday API (vacío o enmascarado conserva el actual)', actual.shipday_api || ''),
    webhook_token: prompt('Webhook token (vacío o enmascarado conserva el actual)', actual.webhook_token || ''),
    woo_webhook_secret: prompt('Woo webhook secret (vacío o enmascarado conserva el actual)', actual.woo_webhook_secret || ''),
    shipday_webhook_secret: prompt('Shipday webhook secret (vacío o enmascarado conserva el actual)', actual.shipday_webhook_secret || ''),
    activo: confirm('Aceptar = restaurante activo. Cancelar = inactivo.')
  };

  if (data.nombre === null) return;

  const res = await fetch(`/admin/restaurantes/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  const result = await res.json();

  if (!res.ok) {
    alert(result.message || 'No se pudo actualizar el restaurante');
    return;
  }

  await cargarRestaurantes();
}

async function generarSecretos(id) {
  if (!confirm('Se reemplazarán los tres secretos de webhook. ¿Continuar?')) return;

  const res = await fetch(`/admin/restaurantes/${id}/generar-secretos`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({})
  });
  const result = await res.json();

  if (!res.ok) {
    alert(result.message || 'No se pudieron generar los secretos');
    return;
  }

  alert('Secretos generados. Por seguridad solo se mostrarán enmascarados.');
  await cargarRestaurantes();
}


/////////////////////////////
// USUARIOS
/////////////////////////////

async function crearUsuario() {

  const data = {
    email: document.getElementById('emailUser').value,
    password: document.getElementById('passUser').value,
    restaurante_id: document.getElementById('restUser').value
  };

  await fetch('/admin/usuarios', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  alert('Usuario creado');

  limpiarCamposUsuario();
  cargarUsuarios();
}


function limpiarCamposUsuario() {
  document.getElementById('emailUser').value = '';
  document.getElementById('passUser').value = '';
  document.getElementById('restUser').value = '';
}


async function cargarUsuarios() {

  const res = await fetch('/admin/usuarios');
  const data = await res.json();

  const cont = document.getElementById('listaUsuarios');
  cont.innerHTML = '';

  data.forEach(u => {
    cont.innerHTML += `
      <div class="card">
        <b>${u.email}</b><br>
        Restaurante: ${u.nombre} (ID ${u.restaurante_id})
      </div>
    `;
  });
}


/////////////////////////////
// INIT
/////////////////////////////

async function iniciarAdmin() {
  try {
    const res = await fetch('/session', { cache: 'no-store' });

    if (!res.ok) {
      window.location.replace('/');
      return;
    }

    const data = await res.json();

    if (!data.authenticated || data.user?.rol !== 'admin') {
      document.body.innerHTML = '<h1>Acceso denegado</h1><p>Se requiere una sesión administrativa.</p>';
      document.body.style.display = 'block';
      return;
    }

    document.body.style.display = 'block';
    await Promise.all([
      cargarRestaurantes(),
      cargarUsuarios()
    ]);
  } catch (error) {
    document.body.innerHTML = '<h1>Acceso denegado</h1><p>No se pudo validar la sesión.</p>';
    document.body.style.display = 'block';
  }
}

iniciarAdmin();

</script>

</body>
</html>
