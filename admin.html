<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171716">
  <title>Administración · Denix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <div class="auth-loader" id="authLoader" role="status" aria-live="polite">
    <div class="loader-mark">D</div>
    <p>Preparando tu espacio de trabajo</p>
  </div>

  <div class="admin-app" id="adminApp" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">D</div>
        <div>
          <strong>Denix</strong>
          <span>Admin console</span>
        </div>
      </div>

      <nav class="primary-nav" aria-label="Navegación administrativa">
        <a class="nav-link" href="/admin" data-route="overview">
          <span class="nav-icon" data-icon="overview" aria-hidden="true"></span>
          <span>Overview</span>
        </a>
        <a class="nav-link" href="/admin/restaurants" data-route="restaurants">
          <span class="nav-icon" data-icon="restaurants" aria-hidden="true"></span>
          <span>Restaurantes</span>
        </a>
        <a class="nav-link" href="/admin/users" data-route="users">
          <span class="nav-icon" data-icon="users" aria-hidden="true"></span>
          <span>Usuarios</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="admin-profile">
          <span class="profile-avatar" id="profileAvatar">A</span>
          <div>
            <strong id="profileName">Administrador</strong>
            <span id="profileEmail">—</span>
          </div>
        </div>
        <button class="icon-button" id="logoutButton" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
          <span data-icon="logout" aria-hidden="true"></span>
        </button>
      </div>
    </aside>

    <div class="app-column">
      <header class="admin-topbar">
        <div class="topbar-title">
          <strong>DENIX</strong>
          <span>Admin Dashboard</span>
        </div>
        <div class="topbar-actions">
          <span class="topbar-date" id="topbarDate">—</span>
          <span class="live-indicator connecting" id="liveIndicator"><i></i><span>CONNECTING</span></span>
          <button class="icon-button topbar-refresh" id="refreshButton" data-refresh-dashboard type="button" aria-label="Refrescar dashboard" title="Refrescar">
            <span data-icon="refresh" aria-hidden="true"></span>
          </button>
          <div class="topbar-user">
            <span class="profile-avatar small" id="topbarAvatar">A</span>
            <div><strong id="topbarUser">Administrador</strong><span>Administrador</span></div>
          </div>
        </div>
      </header>

      <header class="mobile-header">
        <button class="icon-button" id="menuButton" type="button" aria-label="Abrir menú">
          <span data-icon="menu" aria-hidden="true"></span>
        </button>
        <div class="mobile-brand"><span>D</span> Denix <i class="mobile-live" id="mobileLiveIndicator" title="Conectando actualizaciones"></i></div>
        <div class="mobile-actions"><button class="icon-button" data-refresh-dashboard type="button" aria-label="Refrescar dashboard"><span data-icon="refresh"></span></button><div class="profile-avatar small" id="mobileAvatar">A</div></div>
      </header>

      <main class="main-content" id="mainContent" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim" hidden></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script src="/admin/assets/admin.js"></script>
  <script>
    // Compatibilidad con las acciones globales del panel anterior.
    window.editarRestaurante = id => window.DenixAdmin.editarRestaurante(id);
    window.generarSecretos = id => window.DenixAdmin.generarSecretos(id);
    window.crearRestaurante = event => window.DenixAdmin.crearRestaurante(event);
    window.crearUsuario = event => window.DenixAdmin.crearUsuario(event);
  </script>
</body>
</html>
